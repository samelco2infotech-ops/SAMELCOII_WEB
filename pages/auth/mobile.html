<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../../assets/images/samelco-mark.svg" />
    <title>Mobile Login | SAMELCII</title>
    <!-- Mobile auth page ito; Bootstrap mobile login shell para sa phone approvers. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./mobile.css?v=20260611-mobile-auth-v5" />
</head>
<body>
    <!-- SECTION: Mobile Shell -->
    <main class="mobile-auth-shell container-fluid min-vh-100 d-flex align-items-center justify-content-center py-3">
        <section class="mobile-auth-card card border-0 shadow-lg rounded-4">
            <div class="card-body p-3 p-sm-4">
                <div class="mobile-auth-brand text-center">
                    <img src="../../assets/images/samelco-3d.png" alt="SAMELCO II Logo" class="img-fluid" />
                    <p class="eyebrow">Mobile access</p>
                    <h1 class="h3 mb-0">Sign in to approve requests</h1>
                    <p class="lead mb-0">Use your approver account to open the Fuel, EPASS, and Travel approval desk.</p>
                </div>

                <form id="mobile-login-form" class="mobile-login-form mt-3" action="#">
                    <div class="field">
                        <label class="form-label" for="mobile-login-username">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input class="form-control" id="mobile-login-username" type="text" autocomplete="username" placeholder="Enter username" required />
                        </div>
                    </div>
                    <div class="field">
                        <label class="form-label" for="mobile-login-password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input class="form-control" id="mobile-login-password" type="password" autocomplete="current-password" placeholder="Enter password" required />
                            <button class="btn btn-outline-danger eye-btn" type="button" data-target="mobile-login-password" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-lg submit-btn w-100" type="submit">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Login to Mobile Approvals
                    </button>
                    <p id="mobile-login-message" class="message mb-0" aria-live="polite"></p>
                </form>

                <div class="mobile-auth-footer text-center mt-3 pt-3">
                    <a href="./index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                        <i class="bi bi-laptop"></i>
                        Open desktop login
                    </a>
                    <span>Approver only: privilege 6 to 10</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Mobile auth uses the shared Node/JWT client before its page controller.
        const mobileAuthRoot = new URL("../../", window.location.href).toString().replace(/\/$/, "");
        window.SAMELCII_API_BASE = `${mobileAuthRoot}/api`;
        window.SAMELCII_MEDIA_BASE = window.location.origin;
    </script>
    <script src="../../assets/js/api-client.js?v=20260727-node-auth-v1"></script>
    <script src="./mobile.js?v=20260727-node-auth-v1"></script>
</body>
</html>
