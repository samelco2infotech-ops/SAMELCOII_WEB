# VirtualHost Configuration for samelcii.local
# Place this in: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# OR: /etc/apache2/sites-available/samelcii.conf

<VirtualHost *:80>
    ServerName samelcii.local
    ServerAlias samelcii
    DocumentRoot "\\192.168.1.99\htdocs\SAMELCII_WEB_SYSTEM"
    
    <Directory "\\192.168.1.99\htdocs\SAMELCII_WEB_SYSTEM">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog "logs/samelcii-error.log"
    CustomLog "logs/samelcii-access.log" combined
</VirtualHost>
